version: "3.9"

services:

  backend:
    build: ./backend
    container_name: moderation_backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    env_file:
      - .env

  frontend:
    build: ./frontend
    container_name: moderation_frontend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app

    depends_on:
      - backend